name: 🤖 Android C# (.NET & Mono) Editor Build (All-In-One APK)

on:
  workflow_dispatch:
  push:
    branches: [ master, main, 4.* ]

env:
  SCONS_FLAGS: >-
    dev_mode=no
    production=yes
    module_text_server_fb_enabled=yes
    module_mono_enabled=yes
  DOTNET_VERSION: '8.0.x'

jobs:
  build-android-mono:
    runs-on: ubuntu-24.04
    name: Android Editor with C# (arm64)
    timeout-minutes: 120

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Python and SCons
        uses: ./.github/actions/godot-deps

      - name: Download Swappy SDK
        shell: sh
        run: |
          python ./misc/scripts/install_swappy_android.py

      # 1. DOWNLOAD AT EXTRACT NG OFFICIAL MICROSOFT ANDROID ARM64 RUNTIME PACKS
      - name: Download Official Microsoft .NET 8 Android-ARM64 Native Runtime (.so)
        run: |
          set -e
          WORK_DIR=/tmp/dotnet-android-arm64
          mkdir -p $WORK_DIR
          cd $WORK_DIR

          DEST_JNI="$GITHUB_WORKSPACE/platform/android/java/editor/src/main/jniLibs/arm64-v8a"
          mkdir -p "$DEST_JNI"
          mkdir -p "$GITHUB_WORKSPACE/platform/android/java/editor/src/main/assets/GodotSharp/Api"
          mkdir -p "$GITHUB_WORKSPACE/platform/android/java/editor/src/main/assets/GodotSharp/Tools"

          echo "=== Downloading Microsoft.NETCore.App.Runtime.Mono.android-arm64 ==="
          MONO_URLS=(
            "https://api.nuget.org/v3-flatcontainer/microsoft.netcore.app.runtime.mono.android-arm64/8.0.12/microsoft.netcore.app.runtime.mono.android-arm64.8.0.12.nupkg"
            "https://api.nuget.org/v3-flatcontainer/microsoft.netcore.app.runtime.mono.android-arm64/8.0.8/microsoft.netcore.app.runtime.mono.android-arm64.8.0.8.nupkg"
            "https://api.nuget.org/v3-flatcontainer/microsoft.netcore.app.runtime.mono.android-arm64/8.0.0/microsoft.netcore.app.runtime.mono.android-arm64.8.0.0.nupkg"
          )

          DOWNLOADED=false
          for url in "${MONO_URLS[@]}"; do
            echo "Trying $url..."
            if curl -fsSL -o mono.nupkg "$url"; then
              DOWNLOADED=true
              echo "Successfully downloaded mono runtime package!"
              break
            fi
          done

          if [ "$DOWNLOADED" = true ]; then
            unzip -q -o mono.nupkg -d mono_extracted
            find mono_extracted/ -name "*.so" -exec cp -v {} "$DEST_JNI/" \;
          else
            echo "ERROR: Failed to download Mono Android runtime package."
            exit 1
          fi

          echo "=== Downloading Linux-ARM64 runtime for hostfxr / hostpolicy fallback ==="
          mkdir -p /tmp/dotnet-arm64
          curl -sSL https://dot.net/v1/dotnet-install.sh | bash /dev/stdin --runtime dotnet --version 8.0.8 --os linux --arch arm64 --install-dir /tmp/dotnet-arm64 || true
          if [ -d /tmp/dotnet-arm64 ]; then
            find /tmp/dotnet-arm64/ -name "*.so" -exec cp -v {} "$DEST_JNI/" \; || true
          fi

          # Kunin ang official libc++_shared.so mula sa Android NDK
          NDK_PATH="${ANDROID_NDK_HOME:-${ANDROID_NDK_ROOT:-${ANDROID_SDK_ROOT:-$ANDROID_HOME}/ndk}}"
          NDK_LIBCXX=$(find "$NDK_PATH" -name "libc++_shared.so" 2>/dev/null | grep -E "aarch64|arm64-v8a" | head -n 1 || true)
          if [ -n "$NDK_LIBCXX" ] && [ -f "$NDK_LIBCXX" ]; then
            cp -v "$NDK_LIBCXX" "$DEST_JNI/"
            cp -v "$NDK_LIBCXX" "$DEST_JNI/libgcc_s.so.1"
            echo "Copied libc++_shared.so and created libgcc_s.so.1 compatibility stub!"
          fi

          if [ -f "$DEST_JNI/libmonosgen-2.0.so" ]; then
            cp -v "$DEST_JNI/libmonosgen-2.0.so" "$DEST_JNI/libmonosgen.so"
          fi

          echo "=== All Real Android .so libraries in jniLibs/arm64-v8a ==="
          ls -lh "$DEST_JNI/"

      # 2. Build Host Linux Editor & Generate Mono Glue
      - name: Build Host Linux Editor (for Mono Glue)
        run: |
          scons platform=linuxbsd target=editor module_mono_enabled=yes -j$(nproc)
          ./bin/godot.linuxbsd.editor.x86_64.mono --headless --generate-mono-glue modules/mono/glue

      # 3. Build GodotSharp Assemblies
      - name: Build GodotSharp Assemblies
        run: |
          python ./modules/mono/build_scripts/build_assemblies.py --godot-output-dir=./bin --precision=single

      # 4. Compile Android Engine with Mono (ARM64)
      - name: Compile Android Editor with C# (arm64)
        run: |
          scons platform=android target=editor arch=arm64 ${{ env.SCONS_FLAGS }} -j$(nproc)

      # 5. Isama ang GodotSharp Assemblies sa Assets at i-configure ang Gradle
      - name: Bundle GodotSharp inside Android Assets
        run: |
          cp -rv bin/GodotSharp/* platform/android/java/editor/src/main/assets/GodotSharp/
          
          if [ -f platform/android/java/editor/build.gradle ]; then
            echo "" >> platform/android/java/editor/build.gradle
            echo "android {" >> platform/android/java/editor/build.gradle
            echo "    aaptOptions {" >> platform/android/java/editor/build.gradle
            echo "        noCompress 'dll'" >> platform/android/java/editor/build.gradle
            echo "    }" >> platform/android/java/editor/build.gradle
            echo "}" >> platform/android/java/editor/build.gradle
          fi

          echo "=== Bundle Completed ==="
          ls -la platform/android/java/editor/src/main/assets/GodotSharp/

      # 6. Generate All-in-One APK
      - name: Generate Android Editor APK
        run: |
          cd platform/android/java
          ./gradlew generateGodotEditor
          cd ../../..
          ls -lh bin/android_editor_builds/

      # 7. Upload Final Working APK
      - name: Upload GEngine Android Editor APK
        uses: actions/upload-artifact@v4
        with:
          name: GEngine-Android-Editor-CSharp-arm64
          path: bin/android_editor_builds/*.apk
