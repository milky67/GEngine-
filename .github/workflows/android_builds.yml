name: 🤖 Android C# (.NET & Mono) Editor Build (All-In-One APK)

on:
  workflow_dispatch:
  push:
    branches: [ master, main, 4.* ]

env:
  SCONS_FLAGS: >-
    dev_mode=no
    production=yes
    module_text_server_fb_enabled=yes
    module_mono_enabled=yes
  DOTNET_VERSION: '8.0.x'

jobs:
  build-android-mono:
    runs-on: ubuntu-24.04
    name: Android Editor with C# (arm64)
    timeout-minutes: 120

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Python and SCons
        uses: ./.github/actions/godot-deps

      - name: Download Swappy SDK
        shell: sh
        run: |
          python ./misc/scripts/install_swappy_android.py

      # 1. I-download ang .NET 8 Linux ARM64 Native Runtime (.so files)
      - name: Auto-Download .NET 8 ARM64 Runtime Libraries
        run: |
          mkdir -p /tmp/dotnet-arm64
          curl -sSL https://dot.net/v1/dotnet-install.sh | bash /dev/stdin --runtime dotnet --version 8.0.8 --os linux --arch arm64 --install-dir /tmp/dotnet-arm64
          
          mkdir -p platform/android/java/editor/src/main/jniLibs/arm64-v8a
          mkdir -p platform/android/java/editor/src/main/assets/GodotSharp
          
          # Isama ang lahat ng .so libraries sa jniLibs
          find /tmp/dotnet-arm64/ -name "*.so" -exec cp -v {} platform/android/java/editor/src/main/jniLibs/arm64-v8a/ \;

      # 2. Build Host Linux Editor & Mono Glue (Headless)
      - name: Build Host Linux Editor (for Mono Glue)
        run: |
          scons platform=linuxbsd target=editor module_mono_enabled=yes -j$(nproc)
          ./bin/godot.linuxbsd.editor.x86_64.mono --headless --generate-mono-glue modules/mono/glue

      # 3. Build GodotSharp Assemblies
      - name: Build GodotSharp Assemblies
        run: |
          python ./modules/mono/build_scripts/build_assemblies.py --godot-output-dir=./bin --precision=single

      # 4. Compile Android Engine with Mono
      - name: Compile Android Editor with C# (arm64)
        run: |
          scons platform=android target=editor arch=arm64 ${{ env.SCONS_FLAGS }} -j$(nproc)

      # 5. Isama ang GodotSharp Assemblies sa Assets ng APK
      - name: Bundle GodotSharp inside Android Assets
        run: |
          cp -rv bin/GodotSharp/* platform/android/java/editor/src/main/assets/GodotSharp/
          echo "All GodotSharp files and Native .so libs bundled!"

      # 6. Generate All-in-One APK
      - name: Generate Android Editor APK
        run: |
          cd platform/android/java
          ./gradlew generateGodotEditor
          cd ../../..
          ls -lh bin/android_editor_builds/

      # 7. Upload Direct APK
      - name: Upload Android Editor APK
        uses: actions/upload-artifact@v4
        with:
          name: GEngine-Android-Editor-CSharp-arm64
          path: bin/android_editor_builds/*.apk
