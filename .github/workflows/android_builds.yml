name: 🤖 Android C# (.NET & Mono) Editor Build (All-In-One APK)

on:
  workflow_dispatch:
  push:
    branches: [ master, main, 4.* ]

env:
  SCONS_FLAGS: >-
    dev_mode=no
    production=yes
    module_text_server_fb_enabled=yes
    module_mono_enabled=yes
  DOTNET_VERSION: '8.0.x'

jobs:
  build-android-mono:
    runs-on: ubuntu-24.04
    name: Android Editor with C# (arm64)
    timeout-minutes: 120

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Python and SCons
        uses: ./.github/actions/godot-deps

      - name: Download Swappy SDK
        shell: sh
        run: |
          python ./misc/scripts/install_swappy_android.py

      # 1. DOWNLOAD AT I-EXTRACT ANG LAHAT NG .SO, .DLL, .JSON, .PROPS, .TARGETS MULA SA RUNTIMES
      - name: Download & Extract Complete .NET 8 Android-ARM64 Stack
        run: |
          set -e
          WORK_DIR=/tmp/dotnet-android-arm64
          mkdir -p $WORK_DIR
          cd $WORK_DIR

          DEST_JNI="$GITHUB_WORKSPACE/platform/android/java/editor/src/main/jniLibs/arm64-v8a"
          DEST_ASSETS="$GITHUB_WORKSPACE/platform/android/java/editor/src/main/assets"
          DEST_DOTNET="$DEST_ASSETS/dotnet"
          DEST_GODOTSHARP="$DEST_ASSETS/GodotSharp"

          mkdir -p "$DEST_JNI"
          mkdir -p "$DEST_DOTNET/host/fxr/8.0.12"
          mkdir -p "$DEST_DOTNET/shared/Microsoft.NETCore.App/8.0.12"
          mkdir -p "$DEST_GODOTSHARP/Api"
          mkdir -p "$DEST_GODOTSHARP/Tools"
          mkdir -p "$DEST_GODOTSHARP/Mono"
          mkdir -p "$DEST_GODOTSHARP/Sdk"

          echo "=== 1. Downloading Official Mono Android ARM64 Runtime Package ==="
          MONO_URLS=(
            "https://api.nuget.org/v3-flatcontainer/microsoft.netcore.app.runtime.mono.android-arm64/8.0.12/microsoft.netcore.app.runtime.mono.android-arm64.8.0.12.nupkg"
            "https://api.nuget.org/v3-flatcontainer/microsoft.netcore.app.runtime.mono.android-arm64/8.0.8/microsoft.netcore.app.runtime.mono.android-arm64.8.0.8.nupkg"
            "https://api.nuget.org/v3-flatcontainer/microsoft.netcore.app.runtime.mono.android-arm64/8.0.0/microsoft.netcore.app.runtime.mono.android-arm64.8.0.0.nupkg"
          )

          DOWNLOADED=false
          for url in "${MONO_URLS[@]}"; do
            echo "Trying $url..."
            if curl -fsSL -o mono_pack.zip "$url"; then
              DOWNLOADED=true
              echo "Successfully downloaded Mono package!"
              break
            fi
          done

          if [ "$DOWNLOADED" != true ]; then
            echo "ERROR: Failed to download Mono runtime pack."
            exit 1
          fi

          unzip -q -o mono_pack.zip -d mono_extracted

          # Isama ang LAHAT ng .so sa jniLibs at assets
          find mono_extracted/ -name "*.so" -exec cp -v {} "$DEST_JNI/" \;
          find mono_extracted/ -name "*.so" -exec cp -v {} "$DEST_GODOTSHARP/" \;

          # Isama ang LAHAT ng .dll, .json, .props, .targets sa GodotSharp at dotnet root
          find mono_extracted/ \( -name "*.dll" -o -name "*.json" -o -name "*.props" -o -name "*.targets" -o -name "*.xml" \) -exec cp {} "$DEST_GODOTSHARP/Mono/" \;
          find mono_extracted/ \( -name "*.dll" -o -name "*.json" -o -name "*.props" -o -name "*.targets" -o -name "*.xml" \) -exec cp {} "$DEST_GODOTSHARP/Api/" \;
          find mono_extracted/ \( -name "*.dll" -o -name "*.json" -o -name "*.props" -o -name "*.targets" -o -name "*.xml" \) -exec cp {} "$DEST_DOTNET/shared/Microsoft.NETCore.App/8.0.12/" \;

          echo "=== 2. Downloading & Structuring .NET 8 Linux-ARM64 HostFXR & SDK ==="
          mkdir -p /tmp/dotnet-arm64
          curl -sSL https://dot.net/v1/dotnet-install.sh | bash /dev/stdin --runtime dotnet --version 8.0.8 --os linux --arch arm64 --install-dir /tmp/dotnet-arm64 || true
          
          if [ -d /tmp/dotnet-arm64 ]; then
            find /tmp/dotnet-arm64/ -name "*.so" -exec cp -v {} "$DEST_JNI/" \; || true
            find /tmp/dotnet-arm64/ -name "*.so" -exec cp -v {} "$DEST_GODOTSHARP/" \; || true
            find /tmp/dotnet-arm64/ -name "libhostfxr.so" -exec cp -v {} "$DEST_DOTNET/host/fxr/8.0.12/" \; || true
            find /tmp/dotnet-arm64/ -name "libhostpolicy.so" -exec cp -v {} "$DEST_DOTNET/shared/Microsoft.NETCore.App/8.0.12/" \; || true
            find /tmp/dotnet-arm64/ \( -name "*.dll" -o -name "*.json" -o -name "*.props" -o -name "*.targets" -o -name "*.xml" \) -exec cp {} "$DEST_DOTNET/shared/Microsoft.NETCore.App/8.0.12/" \; || true
          fi

          echo "=== 3. Extracting NDK Libs (libc++_shared.so) ==="
          NDK_PATH="${ANDROID_NDK_HOME:-${ANDROID_NDK_ROOT:-${ANDROID_SDK_ROOT:-$ANDROID_HOME}/ndk}}"
          NDK_LIBCXX=$(find "$NDK_PATH" -name "libc++_shared.so" 2>/dev/null | grep -E "aarch64|arm64-v8a" | head -n 1 || true)
          if [ -n "$NDK_LIBCXX" ] && [ -f "$NDK_LIBCXX" ]; then
            cp -v "$NDK_LIBCXX" "$DEST_JNI/"
            cp -v "$NDK_LIBCXX" "$DEST_GODOTSHARP/"
          fi

          if [ -f "$DEST_JNI/libmonosgen-2.0.so" ]; then
            cp -v "$DEST_JNI/libmonosgen-2.0.so" "$DEST_JNI/libmonosgen.so"
            cp -v "$DEST_JNI/libmonosgen-2.0.so" "$DEST_GODOTSHARP/libmonosgen.so"
            cp -v "$DEST_JNI/libmonosgen-2.0.so" "$DEST_GODOTSHARP/libmonosgen-2.0.so"
          fi

          echo "=== All Bundled Native (.so) Libraries in jniLibs/arm64-v8a ==="
          ls -lh "$DEST_JNI/"

      # 2. I-build ang Linux Host Editor para i-generate ang C# Mono Glue
      - name: Build Host Linux Editor (Mono Glue Generator)
        run: |
          scons platform=linuxbsd target=editor module_mono_enabled=yes -j$(nproc)
          HOST_EDITOR=$(find bin/ -maxdepth 1 -name "godot.linuxbsd.editor*" -type f -executable | head -n 1)
          echo "Found host editor: $HOST_EDITOR"
          $HOST_EDITOR --headless --generate-mono-glue modules/mono/glue

      # 3. I-compile ang GodotSharp Assemblies
      - name: Build GodotSharp Assemblies
        run: |
          python ./modules/mono/build_scripts/build_assemblies.py --godot-output-dir=./bin --precision=single

      # 4. I-compile ang Android Editor Engine (arm64)
      - name: Compile Android Editor Engine (arm64)
        run: |
          scons platform=android target=editor arch=arm64 ${{ env.SCONS_FLAGS }} -j$(nproc)

      # 5. Isama ang LAHAT ng GodotSharp DLLs, JSON, PROPS, TARGETS, CSPROJ, SLN sa APK Assets
      - name: Bundle All Assemblies, Props, Targets, Csproj, Sln & Configs into Android Assets
        run: |
          DEST_ASSETS="platform/android/java/editor/src/main/assets"

          # 1. Kopyahin ang buong laman ng bin/GodotSharp (DLLs, JSON configs, Tools, Api)
          if [ -d "bin/GodotSharp" ]; then
            cp -rv bin/GodotSharp/* "$DEST_ASSETS/GodotSharp/"
            cp -rv bin/GodotSharp/Api/* "$DEST_ASSETS/GodotSharp/Api/" || true
            cp -rv bin/GodotSharp/Tools/* "$DEST_ASSETS/GodotSharp/Tools/" || true
          fi

          # 2. Isama ang lahat ng Godot.NET.Sdk props, targets, at templates
          if [ -d "modules/mono/editor/GodotTools/GodotTools/Build" ]; then
            mkdir -p "$DEST_ASSETS/GodotSharp/Tools/Build"
            cp -rv modules/mono/editor/GodotTools/GodotTools/Build/* "$DEST_ASSETS/GodotSharp/Tools/Build/" || true
          fi

          # 3. Kopyahin ang anumang Sdk props/targets mula sa modules/mono
          find modules/mono/ -type f \( -name "*.props" -o -name "*.targets" -o -name "*.csproj" -o -name "*.sln" -o -name "*.xml" \) -exec cp {} "$DEST_ASSETS/GodotSharp/Sdk/" \; || true

          # 4. I-configure ang Gradle upang HINDI i-compress ang mga binaries at configs
          GRADLE_FILE="platform/android/java/editor/build.gradle"
          if [ -f "$GRADLE_FILE" ]; then
            echo "android { aaptOptions { noCompress 'dll', 'json', 'so', 'props', 'targets', 'csproj', 'sln', 'xml', 'config', 'deps.json', 'runtimeconfig.json' } }" >> "$GRADLE_FILE"
          fi

          echo "=== Complete Assets Verification ==="
          ls -la "$DEST_ASSETS/"
          ls -la "$DEST_ASSETS/dotnet/" || true
          ls -la "$DEST_ASSETS/GodotSharp/" || true
          ls -la "$DEST_ASSETS/GodotSharp/Tools/" || true
          ls -la "$DEST_ASSETS/GodotSharp/Api/" || true
          ls -la "$DEST_ASSETS/GodotSharp/Mono/" || true
          ls -la "$DEST_ASSETS/GodotSharp/Sdk/" || true

      # 6. Buuin ang All-In-One Android Editor APK
      - name: Generate Android Editor APK
        run: |
          cd platform/android/java
          ./gradlew generateGodotEditor --stacktrace || ./gradlew assembleDebug --stacktrace
          cd ../../..

      # 7. I-upload ang Final Complete APK Artifact
      - name: Upload GEngine Android Editor APK
        uses: actions/upload-artifact@v4
        with:
          name: GEngine-Android-Editor-CSharp-arm64
          path: |
            bin/android_editor_builds/*.apk
            platform/android/java/editor/build/outputs/apk/**/*.apk
          if-no-files-found: error
