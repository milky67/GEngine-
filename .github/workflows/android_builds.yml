name: 🤖 Android C# (.NET & Mono) Editor Build (All-In-One APK)

on:
  workflow_dispatch:
  push:
    branches: [ master, main, 4.* ]

env:
  SCONS_FLAGS: >-
    dev_mode=no
    production=yes
    module_text_server_fb_enabled=yes
    module_mono_enabled=yes
  DOTNET_VERSION: '8.0.x'

jobs:
  build-android-mono:
    runs-on: ubuntu-24.04
    name: Android Editor with C# (arm64)
    timeout-minutes: 120

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Python and SCons
        uses: ./.github/actions/godot-deps

      - name: Download Swappy SDK
        shell: sh
        run: |
          python ./misc/scripts/install_swappy_android.py

      # 1. DOWNLOAD AT SETUP NG LAHAT NG NATIVE RUNTIME LIBS (.so) PARA SA ANDROID ARM64
      - name: Download All Android Native .NET & Mono Libraries (.so)
        run: |
          mkdir -p /tmp/dotnet-android-arm64
          cd /tmp/dotnet-android-arm64

          # I-setup ang output directory para sa APK native libraries
          DEST_JNI=$GITHUB_WORKSPACE/platform/android/java/editor/src/main/jniLibs/arm64-v8a
          mkdir -p $DEST_JNI
          mkdir -p $GITHUB_WORKSPACE/platform/android/java/editor/src/main/assets/GodotSharp/Api
          mkdir -p $GITHUB_WORKSPACE/platform/android/java/editor/src/main/assets/GodotSharp/Tools

          # A. Download Microsoft .NET CoreCLR Android ARM64 Runtime
          echo "=== Downloading Microsoft.NETCore.App.Runtime.android-arm64 ==="
          curl -sSL -o android_coreclr.zip https://www.nuget.org/api/v2/package/Microsoft.NETCore.App.Runtime.android-arm64/8.0.8 || \
          curl -sSL -o android_coreclr.zip https://www.nuget.org/api/v2/package/Microsoft.NETCore.App.Runtime.android-arm64/8.0.0
          unzip -q -o android_coreclr.zip -d coreclr_extracted

          # B. Download Microsoft MonoVM Android ARM64 Runtime (libmonosgen)
          echo "=== Downloading Microsoft.NETCore.App.Runtime.Mono.android-arm64 ==="
          curl -sSL -o android_mono.zip https://www.nuget.org/api/v2/package/Microsoft.NETCore.App.Runtime.Mono.android-arm64/8.0.8 || \
          curl -sSL -o android_mono.zip https://www.nuget.org/api/v2/package/Microsoft.NETCore.App.Runtime.Mono.android-arm64/8.0.0 || true
          if [ -f android_mono.zip ]; then
            unzip -q -o android_mono.zip -d mono_extracted
          fi

          # C. Download Linux-ARM64 packages para sa hostfxr binaries
          echo "=== Downloading Linux-ARM64 hostfxr ==="
          mkdir -p /tmp/dotnet-arm64
          curl -sSL https://dot.net/v1/dotnet-install.sh | bash /dev/stdin --runtime dotnet --version 8.0.8 --os linux --arch arm64 --install-dir /tmp/dotnet-arm64 || true

          # Kopyahin ang lahat ng nahanap na .so files sa jniLibs/arm64-v8a
          find . -name "*.so" -exec cp -v {} $DEST_JNI/ \;
          find /tmp/dotnet-arm64/ -name "*.so" -exec cp -v {} $DEST_JNI/ \;

          # D. Kunin ang official libc++_shared.so mula sa Android NDK
          NDK_LIBCXX=$(find $ANDROID_SDK_ROOT/ndk -name "libc++_shared.so" | grep "aarch64" | head -n 1)
          if [ -n "$NDK_LIBCXX" ]; then
            cp -v "$NDK_LIBCXX" $DEST_JNI/
            # Gumawa ng symlinks / copies para sa GNU glibc compatibility stubs
            cp -v "$NDK_LIBCXX" $DEST_JNI/libgcc_s.so.1
            echo "Copied libc++_shared.so and created libgcc_s.so.1 compatibility stub!"
          fi

          # E. Kung may libmonosgen-2.0.so, gumawa rin ng alias na libmonosgen.so
          if [ -f "$DEST_JNI/libmonosgen-2.0.so" ]; then
            cp -v "$DEST_JNI/libmonosgen-2.0.so" "$DEST_JNI/libmonosgen.so"
          fi

          echo "=== List of all bundled Android ARM64 Native Libraries ==="
          ls -lh $DEST_JNI/

      # 2. Build Host Linux Editor & Generate Mono Glue
      - name: Build Host Linux Editor (for Mono Glue)
        run: |
          scons platform=linuxbsd target=editor module_mono_enabled=yes -j$(nproc)
          ./bin/godot.linuxbsd.editor.x86_64.mono --headless --generate-mono-glue modules/mono/glue

      # 3. Build GodotSharp Assemblies (C# API & Tools)
      - name: Build GodotSharp Assemblies
        run: |
          python ./modules/mono/build_scripts/build_assemblies.py --godot-output-dir=./bin --precision=single

      # 4. Compile Android Engine with Mono (ARM64)
      - name: Compile Android Editor with C# (arm64)
        run: |
          scons platform=android target=editor arch=arm64 ${{ env.SCONS_FLAGS }} -j$(nproc)

      # 5. Isama ang GodotSharp Assemblies sa Assets at i-configure ang Gradle
      - name: Bundle GodotSharp inside Android Assets
        run: |
          # Kopyahin ang buong GodotSharp binaries directory
          cp -rv bin/GodotSharp/* platform/android/java/editor/src/main/assets/GodotSharp/
          
          # I-disable ang DLL compression sa APK para gumana ang mmap
          if [ -f platform/android/java/editor/build.gradle ]; then
            echo "" >> platform/android/java/editor/build.gradle
            echo "android {" >> platform/android/java/editor/build.gradle
            echo "    aaptOptions {" >> platform/android/java/editor/build.gradle
            echo "        noCompress 'dll'" >> platform/android/java/editor/build.gradle
            echo "    }" >> platform/android/java/editor/build.gradle
            echo "}" >> platform/android/java/editor/build.gradle
          fi

          echo "=== Bundle Completed ==="
          ls -la platform/android/java/editor/src/main/assets/GodotSharp/

      # 6. Generate All-in-One APK
      - name: Generate Android Editor APK
        run: |
          cd platform/android/java
          ./gradlew generateGodotEditor
          cd ../../..
          ls -lh bin/android_editor_builds/

      # 7. Upload Final Working APK
      - name: Upload GEngine Android Editor APK
        uses: actions/upload-artifact@v4
        with:
          name: GEngine-Android-Editor-CSharp-arm64
          path: bin/android_editor_builds/*.apk
