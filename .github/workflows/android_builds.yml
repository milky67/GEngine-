name: 🤖 Android C# (.NET & Mono) Editor Build (All-In-One APK)

on:
  workflow_dispatch:
  push:
    branches: [ master, main, 4.* ]

env:
  SCONS_FLAGS: >-
    dev_mode=no
    production=yes
    module_text_server_fb_enabled=yes
    module_mono_enabled=yes
  DOTNET_VERSION: '8.0.x'

jobs:
  build-android-mono:
    runs-on: ubuntu-24.04
    name: Android Editor with C# (arm64)
    timeout-minutes: 120

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Python and SCons
        uses: ./.github/actions/godot-deps

      - name: Download Swappy SDK
        shell: sh
        run: |
          python ./misc/scripts/install_swappy_android.py

      # 1. DOWNLOAD AT EXTRACT NG OFFICIAL MICROSOFT ANDROID ARM64 RUNTIME PACKS
      - name: Download Official Microsoft .NET 8 Android-ARM64 Native Runtime (.so) & BCL (.dll)
        shell: bash
        run: |
          set -e
          mkdir -p /tmp/dotnet-android-arm64
          cd /tmp/dotnet-android-arm64

          DEST_JNI="$GITHUB_WORKSPACE/platform/android/java/editor/src/main/jniLibs/arm64-v8a"
          DEST_API="$GITHUB_WORKSPACE/platform/android/java/editor/src/main/assets/GodotSharp/Api"
          DEST_TOOLS="$GITHUB_WORKSPACE/platform/android/java/editor/src/main/assets/GodotSharp/Tools"

          mkdir -p "$DEST_JNI"
          mkdir -p "$DEST_API"
          mkdir -p "$DEST_TOOLS"

          download_nuget_package() {
            local pkg="$1"
            local out="$2"
            local versions=("8.0.12" "8.0.11" "8.0.10" "8.0.8" "8.0.0")
            local success=false

            for ver in "${versions[@]}"; do
              local url="https://api.nuget.org/v3-flatcontainer/${pkg}/${ver}/${pkg}.${ver}.nupkg"
              echo "Downloading ${pkg} (${ver})..."
              if curl -f -sSL -o "$out" "$url"; then
                echo "-> Successfully downloaded ${pkg} (${ver})"
                success=true
                break
              fi
            done

            if [ "$success" = true ]; then
              unzip -q -o "$out" -d "${out}_extracted"
            else
              echo "Warning: Failed to download ${pkg}"
            fi
          }

          echo "=== Downloading Microsoft .NET 8 Android ARM64 Runtime Packages ==="
          download_nuget_package "microsoft.netcore.app.runtime.mono.android-arm64" "mono_runtime.nupkg"
          download_nuget_package "microsoft.netcore.app.host.android-arm64" "apphost.nupkg"
          download_nuget_package "microsoft.netcore.app.runtime.nativeaot.android-arm64" "nativeaot.nupkg"

          echo "=== Copying Android Native (.so) Libraries ==="
          find . -type f -name "*.so" -exec cp -v {} "$DEST_JNI/" \;

          echo "=== Copying .NET 8 Core BCL Assemblies (.dll) ==="
          if [ -d "mono_runtime.nupkg_extracted/runtimes/android-arm64/lib" ]; then
            find mono_runtime.nupkg_extracted/runtimes/android-arm64/lib/ -type f -name "*.dll" -exec cp -v {} "$DEST_API/" \;
          fi

          # Mono loader alias
          if [ -f "$DEST_JNI/libmonosgen-2.0.so" ]; then
            cp -v "$DEST_JNI/libmonosgen-2.0.so" "$DEST_JNI/libmonosgen.so"
          fi

          # Official libc++_shared.so mula sa Android NDK
          NDK_LIBCXX=$(find "$ANDROID_SDK_ROOT/ndk" -name "libc++_shared.so" | grep "aarch64" | head -n 1 || true)
          if [ -n "$NDK_LIBCXX" ] && [ -f "$NDK_LIBCXX" ]; then
            cp -v "$NDK_LIBCXX" "$DEST_JNI/"
            echo "Copied libc++_shared.so from Android NDK."
          fi

          echo "=== All Real Android .so libraries in jniLibs/arm64-v8a ==="
          ls -lh "$DEST_JNI/"

      # 2. Build Host Linux Editor & Generate Mono Glue
      - name: Build Host Linux Editor (for Mono Glue)
        run: |
          scons platform=linuxbsd target=editor module_mono_enabled=yes -j$(nproc)
          ./bin/godot.linuxbsd.editor.x86_64.mono --headless --generate-mono-glue modules/mono/glue

      # 3. Build GodotSharp Assemblies
      - name: Build GodotSharp Assemblies
        run: |
          python ./modules/mono/build_scripts/build_assemblies.py --godot-output-dir=./bin --precision=single

      # 4. Compile Android Engine with Mono (ARM64)
      - name: Compile Android Editor with C# (arm64)
        run: |
          scons platform=android target=editor arch=arm64 ${{ env.SCONS_FLAGS }} -j$(nproc)

      # 5. Isama ang GodotSharp Assemblies sa Assets at i-configure ang Gradle
      - name: Bundle GodotSharp inside Android Assets
        run: |
          DEST_ASSETS="platform/android/java/editor/src/main/assets/GodotSharp"
          mkdir -p "$DEST_ASSETS"

          if [ -d "bin/GodotSharp" ]; then
            cp -rv bin/GodotSharp/* "$DEST_ASSETS/"
          fi

          BUILD_GRADLE="platform/android/java/editor/build.gradle"
          if [ -f "$BUILD_GRADLE" ]; then
            if ! grep -q "noCompress" "$BUILD_GRADLE"; then
              echo "" >> "$BUILD_GRADLE"
              echo "android {" >> "$BUILD_GRADLE"
              echo "    aaptOptions {" >> "$BUILD_GRADLE"
              echo "        noCompress 'dll'" >> "$BUILD_GRADLE"
              echo "    }" >> "$BUILD_GRADLE"
              echo "}" >> "$BUILD_GRADLE"
            fi
          fi

          echo "=== Bundle Completed ==="
          ls -la "$DEST_ASSETS/"

      # 6. Generate All-in-One APK
      - name: Generate Android Editor APK
        run: |
          cd platform/android/java
          ./gradlew generateGodotEditor
          cd ../../..
          mkdir -p bin/android_editor_builds/
          find platform/android/java/editor/build/outputs/apk/ -type f -name "*.apk" -exec cp -v {} bin/android_editor_builds/ \;
          ls -lh bin/android_editor_builds/

      # 7. Upload Final Working APK
      - name: Upload GEngine Android Editor APK
        uses: actions/upload-artifact@v4
        with:
          name: GEngine-Android-Editor-CSharp-arm64
          path: bin/android_editor_builds/*.apk
