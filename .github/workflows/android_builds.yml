name: 🤖 Android C# (.NET & Mono) Editor Build (All-In-One APK)

on:
  workflow_dispatch:
  push:
    branches: [ master, main, 4.* ]

env:
  SCONS_FLAGS: >-
    dev_mode=no
    production=yes
    module_text_server_fb_enabled=yes
    module_mono_enabled=yes
  DOTNET_VERSION: '8.0.x'

jobs:
  build-android-mono:
    runs-on: ubuntu-24.04
    name: Android Editor with C# (arm64)
    timeout-minutes: 120

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Python and SCons
        uses: ./.github/actions/godot-deps

      - name: Download Swappy SDK
        shell: sh
        run: |
          python ./misc/scripts/install_swappy_android.py

      # 1. DOWNLOAD & EXTRACT OFFICIAL MICROSOFT ANDROID RUNTIME PACKS
      - name: Download Official Microsoft .NET 8 Android-ARM64 Native Runtime (.so)
        shell: bash
        run: |
          set -e
          TEMP_DIR=$(mktemp -d)
          cd "$TEMP_DIR"

          DEST_JNI="$GITHUB_WORKSPACE/platform/android/java/editor/src/main/jniLibs/arm64-v8a"
          mkdir -p "$DEST_JNI"
          mkdir -p "$GITHUB_WORKSPACE/platform/android/java/editor/src/main/assets/GodotSharp/Api"
          mkdir -p "$GITHUB_WORKSPACE/platform/android/java/editor/src/main/assets/GodotSharp/Tools"

          echo "=== Resolving and Downloading .NET 8 Mono Android-ARM64 Runtime ==="
          VERSIONS=("8.0.12" "8.0.10" "8.0.8" "8.0.0")
          DOWNLOAD_SUCCESS=false

          for VER in "${VERSIONS[@]}"; do
            URL="https://api.nuget.org/v3-flatcontainer/microsoft.netcore.app.runtime.mono.android-arm64/${VER}/microsoft.netcore.app.runtime.mono.android-arm64.${VER}.nupkg"
            echo "Attempting to download version: ${VER}..."
            if curl -f -sSL -o mono_runtime.nupkg "$URL"; then
              echo "Successfully downloaded Mono Android Runtime version ${VER}"
              DOWNLOAD_SUCCESS=true
              break
            fi
          done

          if [ "$DOWNLOAD_SUCCESS" = false ]; then
            echo "Error: Failed to download Mono Android-ARM64 runtime package."
            exit 1
          fi

          unzip -q -o mono_runtime.nupkg -d mono_extracted

          # Copy all Android arm64 shared libraries (.so)
          find mono_extracted/ -type f -name "*.so" -exec cp -v {} "$DEST_JNI/" \;

          # Extract and copy BCL assemblies into GodotSharp assets directory
          find mono_extracted/runtimes/android-arm64/lib/net8.0/ -type f -name "*.dll" -exec cp -v {} "$GITHUB_WORKSPACE/platform/android/java/editor/src/main/assets/GodotSharp/Api/" \; || true

          # Extract Android NDK libc++_shared.so
          NDK_LIBCXX=$(find "$ANDROID_SDK_ROOT/ndk" -name "libc++_shared.so" | grep "aarch64" | head -n 1 || true)
          if [ -n "$NDK_LIBCXX" ] && [ -f "$NDK_LIBCXX" ]; then
            cp -v "$NDK_LIBCXX" "$DEST_JNI/"
            cp -v "$NDK_LIBCXX" "$DEST_JNI/libgcc_s.so.1"
            echo "Copied libc++_shared.so from Android NDK."
          fi

          # Ensure libmonosgen symlink/alias is present
          if [ -f "$DEST_JNI/libmonosgen-2.0.so" ] && [ ! -f "$DEST_JNI/libmonosgen.so" ]; then
            cp -v "$DEST_JNI/libmonosgen-2.0.so" "$DEST_JNI/libmonosgen.so"
          fi

          echo "=== Listing Native Libraries in jniLibs/arm64-v8a ==="
          ls -lh "$DEST_JNI/"

      # 2. Build Host Linux Editor & Generate Mono Glue
      - name: Build Host Linux Editor (for Mono Glue)
        run: |
          scons platform=linuxbsd target=editor module_mono_enabled=yes -j$(nproc)
          ./bin/godot.linuxbsd.editor.x86_64.mono --headless --generate-mono-glue modules/mono/glue

      # 3. Build GodotSharp Assemblies
      - name: Build GodotSharp Assemblies
        run: |
          python ./modules/mono/build_scripts/build_assemblies.py --godot-output-dir=./bin --precision=single

      # 4. Compile Android Engine with Mono (ARM64)
      - name: Compile Android Editor with C# (arm64)
        run: |
          scons platform=android target=editor arch=arm64 ${{ env.SCONS_FLAGS }} -j$(nproc)

      # 5. Bundle GodotSharp Assemblies into APK Assets
      - name: Bundle GodotSharp inside Android Assets
        run: |
          if [ -d "bin/GodotSharp" ]; then
            cp -rv bin/GodotSharp/* platform/android/java/editor/src/main/assets/GodotSharp/
          fi

          BUILD_GRADLE="platform/android/java/editor/build.gradle"
          if [ -f "$BUILD_GRADLE" ]; then
            if ! grep -q "noCompress" "$BUILD_GRADLE"; then
              echo "" >> "$BUILD_GRADLE"
              echo "android {" >> "$BUILD_GRADLE"
              echo "    aaptOptions {" >> "$BUILD_GRADLE"
              echo "        noCompress 'dll'" >> "$BUILD_GRADLE"
              echo "    }" >> "$BUILD_GRADLE"
              echo "}" >> "$BUILD_GRADLE"
            fi
          fi

          echo "=== GodotSharp Assets Bundled ==="
          ls -la platform/android/java/editor/src/main/assets/GodotSharp/

      # 6. Generate All-in-One APK
      - name: Generate Android Editor APK
        run: |
          cd platform/android/java
          ./gradlew generateGodotEditor
          cd ../../..
          mkdir -p bin/android_editor_builds/
          find platform/android/java/editor/build/outputs/apk/ -type f -name "*.apk" -exec cp -v {} bin/android_editor_builds/ \;
          ls -lh bin/android_editor_builds/

      # 7. Upload Final Working APK
      - name: Upload GEngine Android Editor APK
        uses: actions/upload-artifact@v4
        with:
          name: GEngine-Android-Editor-CSharp-arm64
          path: bin/android_editor_builds/*.apk
