name: 🤖 Android C# (.NET & Mono) Editor Build (All-In-One APK)

on:
  workflow_dispatch:
  push:
    branches: [ master, main, 4.* ]

env:
  SCONS_FLAGS: >-
    dev_mode=no
    production=yes
    module_text_server_fb_enabled=yes
    module_mono_enabled=yes
  DOTNET_VERSION: '8.0.x'

jobs:
  build-android-mono:
    runs-on: ubuntu-24.04
    name: Android Editor with C# (arm64)
    timeout-minutes: 120

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Python and SCons
        uses: ./.github/actions/godot-deps

      - name: Download Swappy SDK
        shell: sh
        run: |
          python ./misc/scripts/install_swappy_android.py

      # 1. I-DOWNLOAD ANG TUNAY NA ANDROID NATIVE .NET 8 RUNTIME (.so files na naka-compile para sa Bionic libc)
      - name: Download Official Microsoft .NET 8 Android-ARM64 Native Runtime
        run: |
          mkdir -p /tmp/dotnet-android-arm64
          cd /tmp/dotnet-android-arm64
          
          # I-download ang official Android-arm64 runtime pack mula sa NuGet
          dotnet nuget add source https://api.nuget.org/v3/index.json -n nuget.org || true
          
          echo "Downloading Microsoft.NETCore.App.Runtime.android-arm64 package..."
          curl -sSL -o android_runtime.zip https://www.nuget.org/api/v2/package/Microsoft.NETCore.App.Runtime.android-arm64/8.0.8 || \
          curl -sSL -o android_runtime.zip https://www.nuget.org/api/v2/package/Microsoft.NETCore.App.Runtime.android-arm64/8.0.0
          
          unzip -q android_runtime.zip
          
          # I-setup ang jniLibs para sa Android APK
          mkdir -p $GITHUB_WORKSPACE/platform/android/java/editor/src/main/jniLibs/arm64-v8a
          mkdir -p $GITHUB_WORKSPACE/platform/android/java/editor/src/main/assets/GodotSharp/Api
          mkdir -p $GITHUB_WORKSPACE/platform/android/java/editor/src/main/assets/GodotSharp/Tools

          # Kopyahin ang mga tunay na Android native .so (libcoreclr.so, libhostfxr.so, libclrjit.so, etc.)
          find . -name "*.so" -exec cp -v {} $GITHUB_WORKSPACE/platform/android/java/editor/src/main/jniLibs/arm64-v8a/ \;
          
          # Kopyahin din ang NDK libc++_shared.so
          NDK_LIBCXX=$(find $ANDROID_SDK_ROOT/ndk -name "libc++_shared.so" | grep "aarch64" | head -n 1)
          if [ -n "$NDK_LIBCXX" ]; then
            cp -v "$NDK_LIBCXX" $GITHUB_WORKSPACE/platform/android/java/editor/src/main/jniLibs/arm64-v8a/
          fi

          echo "=== Real Android .so libraries in jniLibs/arm64-v8a ==="
          ls -lh $GITHUB_WORKSPACE/platform/android/java/editor/src/main/jniLibs/arm64-v8a/

      # 2. Build Host Linux Editor & Generate Mono Glue
      - name: Build Host Linux Editor (for Mono Glue)
        run: |
          scons platform=linuxbsd target=editor module_mono_enabled=yes -j$(nproc)
          ./bin/godot.linuxbsd.editor.x86_64.mono --headless --generate-mono-glue modules/mono/glue

      # 3. Build GodotSharp Assemblies
      - name: Build GodotSharp Assemblies
        run: |
          python ./modules/mono/build_scripts/build_assemblies.py --godot-output-dir=./bin --precision=single

      # 4. Compile Android Engine with Mono (ARM64)
      - name: Compile Android Editor with C# (arm64)
        run: |
          scons platform=android target=editor arch=arm64 ${{ env.SCONS_FLAGS }} -j$(nproc)

      # 5. Isama ang GodotSharp Assemblies sa Assets at i-configure ang Gradle
      - name: Bundle GodotSharp inside Android Assets
        run: |
          cp -rv bin/GodotSharp/* platform/android/java/editor/src/main/assets/GodotSharp/
          
          # I-disable ang DLL compression para mabasa ng mmap sa Android
          if [ -f platform/android/java/editor/build.gradle ]; then
            echo "" >> platform/android/java/editor/build.gradle
            echo "android {" >> platform/android/java/editor/build.gradle
            echo "    aaptOptions {" >> platform/android/java/editor/build.gradle
            echo "        noCompress 'dll'" >> platform/android/java/editor/build.gradle
            echo "    }" >> platform/android/java/editor/build.gradle
            echo "}" >> platform/android/java/editor/build.gradle
          fi

          echo "=== Bundle Completed ==="
          ls -la platform/android/java/editor/src/main/assets/GodotSharp/

      # 6. Generate All-in-One APK
      - name: Generate Android Editor APK
        run: |
          cd platform/android/java
          ./gradlew generateGodotEditor
          cd ../../..
          ls -lh bin/android_editor_builds/

      # 7. Upload Final Working APK
      - name: Upload GEngine Android Editor APK
        uses: actions/upload-artifact@v4
        with:
          name: GEngine-Android-Editor-CSharp-arm64
          path: bin/android_editor_builds/*.apk
