name: 🤖 Android C# (.NET & Mono) Editor Build (All-In-One APK)

on:
  workflow_dispatch:
  push:
    branches: [ master, main, 4.* ]

env:
  SCONS_FLAGS: >-
    dev_mode=no
    production=yes
    module_text_server_fb_enabled=yes
    module_mono_enabled=yes
  DOTNET_VERSION: '8.0.x'

jobs:
  build-android-mono:
    runs-on: ubuntu-24.04
    name: Android Editor with C# (arm64)
    timeout-minutes: 120

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Python and SCons
        uses: ./.github/actions/godot-deps

      - name: Download Swappy SDK
        shell: sh
        run: |
          python ./misc/scripts/install_swappy_android.py

      # 1. DOWNLOAD AT EXTRACT NG LAHAT NG NATIVE .SO AT .DLL VIA PYTHON NUGET RESOLVER
      - name: Download All Android Native (.so) and .NET Runtime Libraries
        shell: python
        run: |
          import os
          import sys
          import urllib.request
          import json
          import zipfile
          import shutil

          workspace = os.environ.get("GITHUB_WORKSPACE", os.getcwd())
          dest_jni = os.path.join(workspace, "platform/android/java/editor/src/main/jniLibs/arm64-v8a")
          dest_api = os.path.join(workspace, "platform/android/java/editor/src/main/assets/GodotSharp/Api")
          dest_tools = os.path.join(workspace, "platform/android/java/editor/src/main/assets/GodotSharp/Tools")

          os.makedirs(dest_jni, exist_ok=True)
          os.makedirs(dest_api, exist_ok=True)
          os.makedirs(dest_tools, exist_ok=True)

          packages_to_download = [
              "microsoft.netcore.app.runtime.mono.android-arm64",
              "microsoft.netcore.app.host.android-arm64",
              "microsoft.netcore.app.runtime.nativeaot.android-arm64"
          ]

          temp_dir = "/tmp/nuget_packages"
          os.makedirs(temp_dir, exist_ok=True)

          for pkg in packages_to_download:
              print(f"=== Resolving NuGet Package: {pkg} ===")
              try:
                  # Query NuGet Index API to get latest 8.0.x versions
                  index_url = f"https://api.nuget.org/v3-flatcontainer/{pkg}/index.json"
                  req = urllib.request.Request(index_url, headers={'User-Agent': 'Mozilla/5.0'})
                  with urllib.request.urlopen(req) as resp:
                      data = json.loads(resp.read().decode())
                      versions = [v for v in data.get("versions", []) if v.startswith("8.0.")]
                      if not versions:
                          versions = data.get("versions", [])
                      latest_ver = versions[-1] if versions else "8.0.8"
                      print(f"Latest 8.0.x version found for {pkg}: {latest_ver}")

                  # Download .nupkg
                  nupkg_url = f"https://api.nuget.org/v3-flatcontainer/{pkg}/{latest_ver}/{pkg}.{latest_ver}.nupkg"
                  pkg_file = os.path.join(temp_dir, f"{pkg}.zip")
                  print(f"Downloading: {nupkg_url}")
                  
                  req = urllib.request.Request(nupkg_url, headers={'User-Agent': 'Mozilla/5.0'})
                  with urllib.request.urlopen(req) as response, open(pkg_file, 'wb') as out_file:
                      shutil.copyfileobj(response, out_file)

                  # Extract files
                  extract_dir = os.path.join(temp_dir, pkg)
                  with zipfile.ZipFile(pkg_file, 'r') as zip_ref:
                      zip_ref.extractall(extract_dir)

                  # Copy .so files
                  for root, dirs, files in os.walk(extract_dir):
                      for file in files:
                          full_path = os.path.join(root, file)
                          if file.endswith(".so"):
                              dest_file = os.path.join(dest_jni, file)
                              shutil.copy2(full_path, dest_file)
                              print(f"Copied .so: {file} -> jniLibs/arm64-v8a/")
                          elif file.endswith(".dll") and "lib/net8.0" in full_path:
                              dest_file = os.path.join(dest_api, file)
                              shutil.copy2(full_path, dest_file)

                  print(f"Successfully processed {pkg}!\n")
              except Exception as e:
                  print(f"Notice for package {pkg}: {e}\n")

          # Create mono library alias
          libmono_src = os.path.join(dest_jni, "libmonosgen-2.0.so")
          libmono_dst = os.path.join(dest_jni, "libmonosgen.so")
          if os.path.exists(libmono_src) and not os.path.exists(libmono_dst):
              shutil.copy2(libmono_src, libmono_dst)
              print("Created alias: libmonosgen.so -> libmonosgen-2.0.so")

          # Copy libc++_shared.so from Android NDK
          ndk_root = os.environ.get("ANDROID_SDK_ROOT", "")
          for root, dirs, files in os.walk(ndk_root):
              if "aarch64" in root and "libc++_shared.so" in files:
                  libcxx_src = os.path.join(root, "libc++_shared.so")
                  shutil.copy2(libcxx_src, os.path.join(dest_jni, "libc++_shared.so"))
                  print(f"Copied libc++_shared.so from Android NDK: {libcxx_src}")
                  break

          print("=== Native libraries extracted ===")
          for f in os.listdir(dest_jni):
              print(f" - {f}")

      # 2. Build Host Linux Editor & Generate Mono Glue
      - name: Build Host Linux Editor (for Mono Glue)
        run: |
          scons platform=linuxbsd target=editor module_mono_enabled=yes -j$(nproc)
          ./bin/godot.linuxbsd.editor.x86_64.mono --headless --generate-mono-glue modules/mono/glue

      # 3. Build GodotSharp Assemblies
      - name: Build GodotSharp Assemblies
        run: |
          python ./modules/mono/build_scripts/build_assemblies.py --godot-output-dir=./bin --precision=single

      # 4. Compile Android Engine with Mono (ARM64)
      - name: Compile Android Editor with C# (arm64)
        run: |
          scons platform=android target=editor arch=arm64 ${{ env.SCONS_FLAGS }} -j$(nproc)

      # 5. Isama ang GodotSharp Assemblies sa Assets
      - name: Bundle GodotSharp inside Android Assets
        run: |
          DEST_ASSETS="platform/android/java/editor/src/main/assets/GodotSharp"
          mkdir -p "$DEST_ASSETS"

          if [ -d "bin/GodotSharp" ]; then
            cp -rv bin/GodotSharp/* "$DEST_ASSETS/"
          fi

          BUILD_GRADLE="platform/android/java/editor/build.gradle"
          if [ -f "$BUILD_GRADLE" ]; then
            if ! grep -q "noCompress" "$BUILD_GRADLE"; then
              echo "" >> "$BUILD_GRADLE"
              echo "android {" >> "$BUILD_GRADLE"
              echo "    aaptOptions {" >> "$BUILD_GRADLE"
              echo "        noCompress 'dll'" >> "$BUILD_GRADLE"
              echo "    }" >> "$BUILD_GRADLE"
              echo "}" >> "$BUILD_GRADLE"
            fi
          fi

          echo "=== GodotSharp Assets Bundled ==="
          ls -la "$DEST_ASSETS/"

      # 6. Generate All-in-One APK
      - name: Generate Android Editor APK
        run: |
          cd platform/android/java
          ./gradlew generateGodotEditor
          cd ../../..
          mkdir -p bin/android_editor_builds/
          find platform/android/java/editor/build/outputs/apk/ -type f -name "*.apk" -exec cp -v {} bin/android_editor_builds/ \;
          ls -lh bin/android_editor_builds/

      # 7. Upload Final Working APK
      - name: Upload GEngine Android Editor APK
        uses: actions/upload-artifact@v4
        with:
          name: GEngine-Android-Editor-CSharp-arm64
          path: bin/android_editor_builds/*.apk
